<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High-contrast rounded squircle background for light & dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- ElectoMart Stylized E + Circuit Waves + Star Spark -->
  <g filter="url(#glow)">
    <!-- Circuit Wave Top Track -->
    <path d="M12 24 C 18 16, 26 16, 32 24 C 36 29, 42 31, 46 27" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Circuit Wave Bottom Track -->
    <path d="M10 38 C 16 38, 22 46, 32 44 C 40 42, 44 34, 48 28" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Circuit Nodes (Connection dots) -->
    <circle cx="23" cy="21" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="28" cy="43" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

    <!-- High-tech 8-Point Energy Spark / Star -->
    <g transform="translate(47, 25)">
      <!-- Main vertical and horizontal spikes -->
      <polygon points="0,-13 2.5,-3 13,0 2.5,3 0,13 -2.5,3 -13,0 -2.5,-3" fill="url(#sparkGrad)"/>
      <!-- Diagonal smaller spikes -->
      <polygon points="0,-8 1.8,-2 8,0 1.8,2 0,8 -1.8,2 -8,0 -1.8,-2" transform="rotate(45)" fill="#ffffff"/>
      <!-- Core center bead -->
      <circle cx="0" cy="0" r="2.2" fill="#0284c7"/>
    </g>
  </g>
</svg>
